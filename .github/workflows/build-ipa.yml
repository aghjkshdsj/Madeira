name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select available Xcode
        run: |
          set -e
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d | sort -V | tail -n 1)
            test -n "$XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Fetch Microsoft Visual C++ runtime
        run: |
          set -euo pipefail
          command -v 7zz >/dev/null 2>&1 || brew install sevenzip
          rm -rf /tmp/vcredist app/Madeira/x86_64-vcruntime
          mkdir -p /tmp/vcredist app/Madeira/x86_64-vcruntime
          curl -L --fail --retry 5 --retry-delay 2 \
            -o /tmp/VC_redist.x64.exe \
            https://aka.ms/vc14/vc_redist.x64.exe
          7zz x /tmp/VC_redist.x64.exe -o/tmp/vcredist >/dev/null
          rm -rf /tmp/vcruntime-extracted
          mkdir -p /tmp/vcruntime-extracted

          CAB_COUNT=0
          while IFS= read -r -d '' CAB; do
            CAB_COUNT=$((CAB_COUNT + 1))
            7zz x "$CAB" -o/tmp/vcruntime-extracted >/dev/null
          done < <(find /tmp/vcredist -type f -iname '*.cab' -print0)
          test "$CAB_COUNT" -gt 0

          required=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            vcamp140.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )
          for dll in "${required[@]}"; do
            found=""
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep -q "x86-64"; then
                found="$candidate"
                break
              fi
            done < <(find /tmp/vcruntime-extracted -type f -iname "$dll" -print0)
            test -n "$found"
            cp "$found" "app/Madeira/x86_64-vcruntime/$dll"
            file "app/Madeira/x86_64-vcruntime/$dll" | grep -q "x86-64"
          done
          echo "VC++ runtime files ready: ${#required[@]} x86-64 DLLs"

      - name: Inspect project
        run: |
          xcodebuild -list -project app/Madeira.xcodeproj

      - name: Build unsigned IPA
        run: |
          set -e
          rm -rf build/DerivedData build/IPA
          mkdir -p build/IPA
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name "Madeira.app" -path "*/Release-iphoneos/*" | head -n 1)
          test -n "$APP_PATH"
          mkdir -p build/IPA/Payload
          cp -R "$APP_PATH" build/IPA/Payload/Madeira.app
          cd build/IPA
          zip -qry Madeira.ipa Payload

      - name: Create release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Madeira IPA build ${{ github.run_number }}
          generate_release_notes: true
          files: build/IPA/Madeira.ipa
