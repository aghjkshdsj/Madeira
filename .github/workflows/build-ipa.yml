name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "FEX"
      - "wine"
      - "research/dxmt"
      - "app/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-vc-runtime:
    runs-on: windows-latest
    steps:
      - name: Download Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://aka.ms/vc14/vc_redist.x64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          $expectedSha256 = "843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actualSha256 = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Microsoft VC++ Redistributable SHA-256 mismatch."
          }

      - name: Install and collect Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          $install = Start-Process -FilePath $exe -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) {
            throw "VC++ Redistributable installation failed with exit code $($install.ExitCode)."
          }

          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "runtime\x86_64-vcruntime"
          Remove-Item -Path $runtimeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          $required = @(
            "concrt140.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "vcamp140.dll",
            "vccorlib140.dll",
            "vcomp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vcruntime140_threads.dll"
          )

          foreach ($dllName in $required) {
            $source = Join-Path $env:WINDIR ("System32\" + $dllName)
            if (-not (Test-Path -LiteralPath $source)) {
              throw ("Required x64 VC++ DLL was not installed: " + $dllName)
            }
            $signature = Get-AuthenticodeSignature -FilePath $source
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
              throw ("Authenticode validation failed for " + $dllName)
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $runtimeDir $dllName) -Force
          }

      - name: Upload VC++ runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: vc-runtime-x64
          path: runtime/x86_64-vcruntime
          if-no-files-found: error

  native:
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        component: [fex, wine, dxmt]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record toolchain
        id: sdk
        run: |
          xcodebuild -version
          echo "version=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - name: Cache completed native component
        id: native-cache
        uses: actions/cache@v4
        with:
          path: build/ci-${{ matrix.component }}.tar
          key: native-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ matrix.component }}-${{ hashFiles('build/ci/**', 'build/wineserver/**', 'build/ntdll-unix/**', 'build/win32u-unix/**', 'build/dxmt-ios/**', 'build/gnutls-ios/**', 'build/freetype-ios/**', '.gitmodules') }}-053c385-7817e22-b4b89f0
      - name: Restore crypto dependencies
        if: matrix.component == 'wine' && steps.native-cache.outputs.cache-hit != 'true'
        id: crypto-cache
        uses: actions/cache@v4
        with:
          path: toolchains/gnutls-ios
          key: crypto-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ hashFiles('build/gnutls-ios/**') }}
      - name: Build crypto dependencies
        if: matrix.component == 'wine' && steps.native-cache.outputs.cache-hit != 'true' && steps.crypto-cache.outputs.cache-hit != 'true'
        run: bash build/gnutls-ios/build.sh
      - name: Save completed crypto dependencies
        if: matrix.component == 'wine' && steps.native-cache.outputs.cache-hit != 'true' && steps.crypto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/gnutls-ios
          key: ${{ steps.crypto-cache.outputs.cache-primary-key }}
      - name: Restore LLVM iOS dependencies
        if: matrix.component == 'dxmt' && steps.native-cache.outputs.cache-hit != 'true'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
          key: llvm15-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ hashFiles('build/ci/build-llvm.sh') }}
      - name: Build LLVM for iOS
        if: matrix.component == 'dxmt' && steps.native-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash build/ci/build-llvm.sh
      - name: Save completed LLVM dependencies
        if: matrix.component == 'dxmt' && steps.native-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Build native component
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          bash "build/ci/build-$COMPONENT.sh"
          case "$COMPONENT" in
            fex) tar -cf build/ci-fex.tar FEX/build-ios ;;
            wine) tar -cf build/ci-wine.tar app/Madeira/libwineserver.a app/Madeira/libntdll_unix.a app/Madeira/libwin32u_unix.a app/Madeira/libgmp.a app/Madeira/libnettle.a app/Madeira/libhogweed.a app/Madeira/libgnutls.a ;;
            dxmt) tar -cf build/ci-dxmt.tar app/Madeira/libdxmt_combined.a ;;
          esac
      - name: Upload native component
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.component }}
          path: build/ci-${{ matrix.component }}.tar
          if-no-files-found: error
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.component }}
          path: |
            build/**/*.err
            build/**/err-*.txt
            build/**/*.log
            wine/build-macos/config.log
            toolchains/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  release:
    needs: [prepare-vc-runtime, native]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/native-artifacts
          merge-multiple: true
      - name: Install native libraries
        run: |
          set -euo pipefail
          for archive in build/native-artifacts/*.tar; do
            tar -xf "$archive"
          done
      - uses: actions/download-artifact@v4
        with:
          name: vc-runtime-x64
          path: app/Madeira/x86_64-vcruntime
      - name: Verify Microsoft runtime architecture
        run: |
          set -euo pipefail
          for dll in app/Madeira/x86_64-vcruntime/*.dll; do
            file "$dll" | grep -q x86-64
          done
      - name: Build and validate unsigned IPA
        run: bash build/ci/package.sh
      - name: Preserve IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned
          path: |
            build/IPA/Madeira.ipa
            build/IPA/Madeira.ipa.sha256
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "Madeira unsigned IPA build ${{ github.run_number }}" \
            --notes "Unsigned arm64 iOS build. Requires signing and the project's device/JIT setup. See the included SHA-256 checksum." \
            build/IPA/Madeira.ipa build/IPA/Madeira.ipa.sha256
          mkdir -p build/release-verification
          gh release download "$RELEASE_TAG" --dir build/release-verification \
            --pattern Madeira.ipa --pattern Madeira.ipa.sha256
          cd build/release-verification
          shasum -a 256 -c Madeira.ipa.sha256
          cmp Madeira.ipa ../IPA/Madeira.ipa
          gh release view "$RELEASE_TAG" --json url,assets
      - name: Preserve Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
